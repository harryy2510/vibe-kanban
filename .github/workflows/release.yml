name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.46-20260412160500)'
        required: true
        type: string
      cli:
        description: 'Build CLI binaries + publish npm + upload R2'
        required: false
        type: string
        default: 'true'
      remote:
        description: 'Build remote Docker image'
        required: false
        type: string
        default: 'true'
      relay:
        description: 'Build relay Docker image'
        required: false
        type: string
        default: 'true'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      cli: ${{ steps.derive.outputs.cli }}
      remote: ${{ steps.derive.outputs.remote }}
      relay: ${{ steps.derive.outputs.relay }}
    steps:
      - name: Derive tag and version
        id: derive
        run: |
          # For tag pushes, github.ref_name is the tag (e.g. "v0.1.46-20260412160500").
          # For workflow_dispatch, use the input.
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          # Extract bare version from tag: "v0.1.46-20260412160500" -> "0.1.46"
          version=$(echo "$tag" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          # Component flags default to true (build everything) unless dispatch says otherwise.
          cli="${{ inputs.cli || 'true' }}"
          remote="${{ inputs.remote || 'true' }}"
          relay="${{ inputs.relay || 'true' }}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "cli=$cli" >> $GITHUB_OUTPUT
          echo "remote=$remote" >> $GITHUB_OUTPUT
          echo "relay=$relay" >> $GITHUB_OUTPUT
          echo "Releasing tag=$tag version=$version (cli=$cli remote=$remote relay=$relay)"

  build-frontend:
    needs: meta
    if: needs.meta.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local-web
        run: pnpm -C packages/local-web build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: packages/local-web/dist/
          retention-days: 1

  build-cli:
    needs: [meta, build-frontend]
    if: needs.meta.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: packages/local-web/dist/

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang libclang-dev

      - name: Install cross for Linux arm64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (Linux arm64 via cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: cross build --release --target ${{ matrix.target }} -p server -p mcp -p review --bin server --bin vibe-kanban-mcp --bin review

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p server -p mcp -p review --bin server --bin vibe-kanban-mcp --bin review

      - name: Package zips
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cd target/${{ matrix.target }}/release
          mv server vibe-kanban
          zip ../../../dist/${{ matrix.name }}/vibe-kanban.zip vibe-kanban
          zip ../../../dist/${{ matrix.name }}/vibe-kanban-mcp.zip vibe-kanban-mcp
          mv review vibe-kanban-review
          zip ../../../dist/${{ matrix.name }}/vibe-kanban-review.zip vibe-kanban-review

      - name: Upload platform zips
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          retention-days: 1

  upload-r2:
    needs: [meta, build-cli]
    if: needs.meta.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform zips
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: binaries/
          merge-multiple: false

      - name: Flatten layout
        run: |
          mkdir -p flat
          for dir in binaries/cli-*; do
            platform=${dir#binaries/cli-}
            mkdir -p flat/$platform
            cp $dir/*.zip flat/$platform/
          done
          find flat/

      - name: Generate manifest
        run: |
          node -e "
            const fs=require('fs'), crypto=require('crypto');
            const manifest={version:'${{ needs.meta.outputs.tag }}',platforms:{}};
            const platforms=['linux-x64','linux-arm64','macos-x64','macos-arm64'];
            const binaries=['vibe-kanban','vibe-kanban-mcp','vibe-kanban-review'];
            for (const p of platforms) {
              manifest.platforms[p]={};
              for (const b of binaries) {
                const zp='flat/'+p+'/'+b+'.zip';
                if (fs.existsSync(zp)) {
                  const d=fs.readFileSync(zp);
                  manifest.platforms[p][b]={sha256:crypto.createHash('sha256').update(d).digest('hex'),size:d.length};
                }
              }
            }
            fs.writeFileSync('manifest.json', JSON.stringify(manifest,null,2));
          "
          cat manifest.json

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_BINARIES_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_BINARIES_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload zips to R2
        env:
          ENDPOINT: ${{ vars.R2_BINARIES_ENDPOINT }}
          BUCKET: ${{ vars.R2_BINARIES_BUCKET }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            for b in vibe-kanban vibe-kanban-mcp vibe-kanban-review; do
              if [ -f "flat/$platform/$b.zip" ]; then
                aws s3 cp "flat/$platform/$b.zip" \
                  "s3://$BUCKET/binaries/$TAG/$platform/$b.zip" \
                  --endpoint-url "$ENDPOINT"
              fi
            done
          done
          aws s3 cp manifest.json "s3://$BUCKET/binaries/$TAG/manifest.json" --endpoint-url "$ENDPOINT" --content-type application/json
          echo "{\"latest\": \"$VERSION\"}" | \
            aws s3 cp - "s3://$BUCKET/binaries/manifest.json" --endpoint-url "$ENDPOINT" --content-type application/json

  publish-npm:
    needs: [meta, upload-r2]
    if: needs.meta.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npx-cli deps
        run: cd npx-cli && npm ci

      - name: Build npx-cli
        run: cd npx-cli && npm run build

      - name: Bake R2 URL and tag into bundle
        run: |
          cd npx-cli
          sed -i "s|__R2_PUBLIC_URL__|${{ vars.R2_BINARIES_PUBLIC_URL }}|g" bin/cli.js
          sed -i "s|__BINARY_TAG__|${{ needs.meta.outputs.tag }}|g" bin/cli.js

      - name: Pack and publish
        run: |
          cd npx-cli
          npm pack
          npm publish *.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tgz to GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            npx-cli/*.tgz

  build-remote-image:
    needs: meta
    if: needs.meta.outputs.remote == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/remote/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=VibePilot remote API service
            org.opencontainers.image.licenses=MIT
          build-args: |
            VITE_RELAY_API_BASE_URL=https://relay.vibepilot.org
          cache-from: type=gha,scope=remote-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=remote-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/remote,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-remote-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-remote-manifest:
    needs: [meta, build-remote-image]
    if: needs.meta.outputs.remote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digests-remote-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/remote:latest \
            -t ghcr.io/${{ github.repository }}/remote:${{ needs.meta.outputs.tag }} \
            $(printf 'ghcr.io/${{ github.repository }}/remote@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}/remote:${{ needs.meta.outputs.tag }}

  build-relay-image:
    needs: meta
    if: needs.meta.outputs.relay == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay-tunnel/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=VibePilot relay tunnel service
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=relay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=relay-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/relay,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-relay-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-relay-manifest:
    needs: [meta, build-relay-image]
    if: needs.meta.outputs.relay == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digests-relay-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/relay:latest \
            -t ghcr.io/${{ github.repository }}/relay:${{ needs.meta.outputs.tag }} \
            $(printf 'ghcr.io/${{ github.repository }}/relay@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}/relay:${{ needs.meta.outputs.tag }}

  deploy-dokploy:
    needs: [meta, build-remote-manifest, build-relay-manifest]
    # Run if either image was rebuilt. !cancelled() lets this run even when one of
    # the manifest jobs was skipped (due to the other path filter being false).
    if: "!cancelled() && (needs.meta.outputs.remote == 'true' || needs.meta.outputs.relay == 'true') && !contains(needs.*.result, 'failure')"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"

  restart-oxmgr:
    needs: [meta, publish-npm]
    if: needs.meta.outputs.cli == 'true' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Restart oxmgr vibe-kanban app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_SSH_HOST }}
          username: ${{ vars.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            source ~/.profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            export PATH="$HOME/.bun/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
            oxmgr restart vibe-kanban
